name = "bolnee-dashboard"
type = "javascript"
compatibility_date = "2024-01-01"

[build]
command = "npm run build"

[site]
bucket = "./dist"
entry-point = "./"

# For Cloudflare Workers with Express via wrangler + nodejs compat
# Endpoints auto-resolve to same origin: /api/chatbots, /api/public/chat/:id, /chatbot-widget.js
# SECURITY: DISABLE_AUTH must be false in production. Set to true only for local single-tenant dev.
# Use `wrangler secret put JWT_SECRET` for the encryption/JWT secret, never commit it in [vars].

[vars]
DISABLE_AUTH = "false"
