<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BM25 + Context Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .test-container {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      margin: 0 0 24px 0;
      color: #333;
    }
    .input-group {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    input {
      flex: 1;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      padding: 12px 24px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover {
      background: #4f46e5;
    }
    .result {
      background: #f9fafb;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .result-header {
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
    }
    .result-text {
      color: #6b7280;
      margin-bottom: 8px;
    }
    .result-meta {
      font-size: 14px;
      color: #9ca3af;
    }
    .memory-state {
      background: #fef3c7;
      border-left: 4px solid #f59e0b;
      padding: 12px;
      margin-top: 24px;
      border-radius: 4px;
    }
    .memory-title {
      font-weight: 600;
      color: #92400e;
      margin-bottom: 8px;
    }
    .score {
      display: inline-block;
      padding: 4px 8px;
      background: #6366f1;
      color: white;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }
    .out-of-domain {
      background: #fee2e2;
      border-left: 4px solid #ef4444;
    }
  </style>
</head>
<body>
  <div class="test-container">
      <h1>🔍 BM25 + Context Memory Test <span id="domainLabel" style="font-size:14px;background:#e5e7eb;padding:4px 10px;border-radius:4px;font-weight:400;"></span></h1>
      <p style="margin:-16px 0 24px 0;font-size:13px;color:#9ca3af;">Use <code style="background:#f3f4f6;padding:2px 6px;border-radius:3px;">?domain=truff</code> to switch — or <code style="background:#f3f4f6;padding:2px 6px;border-radius:3px;">?corpus=path&responses=path</code> for custom files</p>
    
    <div class="input-group" style="margin-bottom:12px;">
      <input type="text" id="domainInput" placeholder="domain (e.g. truff)" style="flex:0 0 140px;" value="madsencycles" />
      <button onclick="switchDomain()" style="background:#10b981;">Switch Domain</button>
      <button onclick="reset()" style="background: #ef4444;">Reset</button>
    </div>
    <div class="input-group">
      <input type="text" id="queryInput" placeholder="Try: 'gold chain', 'how much is it?', 'what about shipping?'" />
      <button onclick="search()">Search</button>
    </div>
    
    <div id="results"></div>
    
    <div class="memory-state">
      <div class="memory-title">Memory State</div>
      <div id="memoryState"></div>
    </div>
  </div>

  <script type="module">
    import { BM25 } from './bm25.js';
    import { ContextMemory } from './context-memory.js';
    import { RetrievalEngine } from './retrieval-engine.js';
    import { ResponseSelector } from './response-selector.js';

    // Initialize
    const retrieval = new RetrievalEngine();
    const memory = new ContextMemory();
    let selector = null;

    // Load corpus: try API first, fall back to local data/ file
    async function loadCorpus(id) {
      try {
        const res = await fetch(`/api/public/corpus/${id}`);
        if (res.ok) return await res.json();
      } catch {}
      const local = await fetch(`/data/${id}_corpus.json`);
      if (local.ok) return await local.json();
      throw new Error(`No corpus found for "${id}"`);
    }

    // Load responses: try API first, fall back to local data/ file
    async function loadResponses(id) {
      try {
        const res = await fetch(`/api/public/knowledge/${id}`);
        if (res.ok) return await res.json();
      } catch {}
      const local = await fetch(`/data/${id}_responses.json`);
      if (local.ok) return await local.json();
      throw new Error(`No responses found for "${id}"`);
    }

    async function init(domain) {
      document.getElementById('domainLabel').textContent = domain;
      document.getElementById('results').innerHTML = '';
      memory.reset();
      selector = null;

      console.log('Loading corpus for:', domain);
      try {
        const corpus = await loadCorpus(domain);
        retrieval.corpus = corpus;
        retrieval.bm25 = new BM25(corpus.documents);
        retrieval.ready = true;
        console.log(`✅ Corpus loaded: ${corpus.document_count} documents`);
      } catch (e) {
        console.error('❌', e.message);
        document.getElementById('results').innerHTML = `<div class="result out-of-domain"><div class="result-header">❌ ${e.message}</div></div>`;
        return;
      }

      console.log('Loading responses...');
      try {
        const responsesData = await loadResponses(domain);
        selector = new ResponseSelector(responsesData);
        console.log('✅ System ready!');
        console.log('Responses loaded:', Object.keys(responsesData.responses || {}));
      } catch (e) {
        console.error('❌', e.message);
        document.getElementById('results').innerHTML = `<div class="result out-of-domain"><div class="result-header">❌ ${e.message}</div></div>`;
      }
    }

    // Read domain from URL: ?domain=truff (default: madsencycles)
    const urlParams = new URLSearchParams(window.location.search);
    const initialDomain = urlParams.get('domain') || 'madsencycles';
    document.getElementById('domainInput').value = initialDomain;
    await init(initialDomain);

    window.switchDomain = async function() {
      const domain = document.getElementById('domainInput').value.trim();
      if (!domain) return;
      await init(domain);
      updateMemoryDisplay();
    };

    // Make functions global for onclick
    window.search = function() {
      const query = document.getElementById('queryInput').value.trim();
      if (!query) return;
      
      console.log('\n🔍 Original query:', query);
      
      // Step 1: Context resolution
      const resolved = memory.resolve(query);
      console.log('📝 Resolved query:', resolved);
      
      // Step 2: BM25 search
      const { results, outOfDomain, topScore } = retrieval.search(resolved);
      
      // Step 3: Display results
      displayResults(query, resolved, results, outOfDomain, topScore);
      
      // Step 4: Update memory if not out of domain
      if (!outOfDomain && results.length > 0) {
        const topDoc = results[0].doc;
        const entity = {
          type: topDoc.meta.type,
          slug: topDoc.meta.slug,
          name: topDoc.meta.title || topDoc.meta.slug
        };
        
        // Detect intent from query
        const intent = selector._detectIntent(query, topDoc.meta, topDoc.text);
        memory.update(entity, intent);
      }
      
      // Update memory display
      updateMemoryDisplay();
      
      // Clear input
      document.getElementById('queryInput').value = '';
    };
    
    window.reset = function() {
      memory.reset();
      document.getElementById('results').innerHTML = '';
      updateMemoryDisplay();
      console.log('🔄 Memory reset');
    };
    
    function displayResults(original, resolved, results, outOfDomain, topScore) {
      const container = document.getElementById('results');
      
      if (outOfDomain) {
        container.innerHTML = `
          <div class="result out-of-domain">
            <div class="result-header">❌ Out of Domain</div>
            <div class="result-text">
              Score too low (${topScore.toFixed(3)} < 0.4). 
              Would show: "${selector.getOutOfDomainMessage(retrieval.corpus?.domain)}"
            </div>
          </div>
        ` + container.innerHTML;
        return;
      }
      
      // Show only the TOP result (what user sees)
      const topResult = results[0];
      const response = selector.select(topResult, memory, original); // Pass original query
      
      let html = `
        <div class="result" style="border: 3px solid #10b981; background: #f0fdf4;">
          <div class="result-header" style="color: #065f46; font-size: 16px;">
            🤖 <strong>BOT RESPONSE</strong>
            <span class="score">${topResult.score.toFixed(3)}</span>
          </div>
          <div class="result-text" style="font-size: 15px; color: #064e3b; margin: 12px 0;">
            <strong>"${response.text}"</strong>
          </div>
          <div class="result-meta" style="margin-top: 8px; padding-top: 8px; border-top: 1px solid #86efac;">
            <div><strong>Query:</strong> ${original}</div>
            ${resolved !== original ? `<div><strong>Resolved:</strong> ${resolved}</div>` : ''}
            <div><strong>Intent:</strong> ${response.intent}</div>
            <div><strong>Matched:</strong> ${topResult.doc.meta.title || topResult.doc.meta.slug}</div>
          </div>
        </div>
      `;
      
      // Show other candidates (debug info)
      if (results.length > 1) {
        html += `<details style="margin-top: 12px;"><summary style="cursor: pointer; color: #6b7280; font-size: 14px;">🔍 Other candidates (${results.length - 1})</summary>`;
        results.slice(1).forEach((result, i) => {
          const otherResponse = selector.select(result, memory, original);
          html += `
            <div class="result" style="opacity: 0.6; margin-top: 8px;">
              <div class="result-header">
                📄 Candidate ${i + 2} 
                <span class="score" style="background: #9ca3af;">${result.score.toFixed(3)}</span>
              </div>
              <div class="result-text">${otherResponse.text}</div>
              <div class="result-meta">
                ${result.doc.meta.title || result.doc.meta.slug} | 
                ${otherResponse.intent}
              </div>
            </div>
          `;
        });
        html += `</details>`;
      }
      
      container.innerHTML = html + container.innerHTML;
    }
    
    function updateMemoryDisplay() {
      const state = {
        'Last Entity': memory.lastEntity?.name || 'None',
        'Last Intent': memory.lastIntent || 'None',
        'Turn Count': memory.turnCount,
        'Entity History': memory.entityHistory.map(e => e.name).join(', ') || 'Empty',
        'Preferences': JSON.stringify(memory.preferences)
      };
      
      document.getElementById('memoryState').innerHTML = 
        Object.entries(state)
          .map(([k, v]) => `<div><strong>${k}:</strong> ${v}</div>`)
          .join('');
    }
    
    // Initial display
    updateMemoryDisplay();
    
    // Allow Enter key
    document.getElementById('queryInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') search();
    });
  </script>
</body>
</html>
