<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bolnee Demo — Local Test</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      max-width: 600px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, .08);
      text-align: center;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    p {
      color: #666;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .note {
      background: #f0f0f7;
      border-radius: 10px;
      padding: 16px;
      font-size: 13px;
      color: #555;
      text-align: left;
    }

    .note code {
      background: #e0e0ea;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Bolnee Chatbot Demo</h1>
    <p>Click the chat bubble in the bottom-right corner to test the chatbot.</p>
    <div class="note">
      <strong>Try messages like:</strong><br>
      • "Show me shoes under 10000"<br>
      • "What is your return policy?"<br>
      • "How can I contact support?"<br>
      • "Tell me about the store"
    </div>
  </div>

<script>
  window.BotConfig = {
    modelId: 'onnx-community/Qwen2.5-0.5B-Instruct',
    botName: 'Bolnee',
    accentColor: '#6366f1',
    greeting: 'Hi! How can I help you today?',
    systemPrompt: 'You are a helpful assistant for our store.',
    // workerUrl: 'http://localhost:3000/chat-worker.js',  // Use inline worker
    knowledgeUrl: 'http://localhost:3000/api/public/knowledge/bot_1e58d6e7-af04-445f-92c0-bc6764691184',
  };

  // Register Service Worker for persistent model caching
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('http://localhost:3000/sw.js')
        .then(reg => {
          console.log('[demo] Service Worker registered:', reg.scope);
        })
        .catch(err => {
          console.warn('[demo] Service Worker registration failed:', err);
        });
    });
  }
</script>
<script src="http://localhost:3000/intent-detection.js?v=2"></script>
<script src="http://localhost:3000/chatbot-widget.js?v=2" async></script>
</body>

</html>
